<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>نهضة أمة • الموقف المالي</title>

  <!-- أيقونات الشاشة الرئيسية للآيفون والأندرويد -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <!-- شريط حالة معتم لتجنب التعتيم/الضباب في تطبيق iPhone المثبت -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="الموقف المالي" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b132b" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #f1f5f9;
      font-family: "Segoe UI", Tahoma, sans-serif;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    .app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    iframe#appFrame {
      width: 100%;
      height: 100%;
      min-height: 0;
      flex: 1 1 0%;
      border: none;
      display: block;
      background: #f1f5f9;
    }

    /* شاشة تحميل سريعة بشعار نهضة أمة حتى يجهز التطبيق */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      background: linear-gradient(155deg, #0b132b 0%, #1c2541 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ffffff;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .splash.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: #ffffff;
      padding: 6px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .splash-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .splash-sub {
      font-size: 13px;
      color: #cbd5e1;
    }

    .loader-bar {
      width: 140px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
      margin-top: 4px;
    }

    .loader-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1aa3b8, #f2b45a);
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(120%); }
      100% { transform: translateX(-220%); }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-logo">
      <img src="./icon-192.png" alt="شعار نهضة أمة" />
    </div>
    <div class="splash-title">نهضة أمة • الموقف المالي</div>
    <div class="splash-sub">جاري الاتصال المباشر بالنظام...</div>
    <div class="loader-bar"></div>
  </div>

  <div class="app-shell">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzUnlLg5ImFn5WvhLzN0QIF-Ds7w5xguQZwEXzwUB0x1jbD76ebcGRwlgEirrBpbtRAbg/exec"
      allow="clipboard-write; web-share"
      allowfullscreen
      title="نهضة أمة - الموقف المالي"
    ></iframe>
  </div>

  <script>
    const splash = document.getElementById("splash");
    const frame = document.getElementById("appFrame");

    function hideSplash() {
      splash.classList.add("done");
    }

    frame.addEventListener("load", function () {
      setTimeout(hideSplash, 250);
    });

    // ضمان إخفاء شاشة التحميل بعد 5 ثوانٍ كحد أقصى
    setTimeout(hideSplash, 5000);

    // تسجيل Service Worker لتفعيل التثبيت التلقائي على الأندرويد بأيقونة المؤسسة
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
